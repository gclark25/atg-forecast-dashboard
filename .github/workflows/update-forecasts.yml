name: Update ATG Forecasts

on:
  # Schedule trigger removed 2026-10-06 -- the live pull now runs on a
  # Cloudflare Worker Cron Trigger instead (worker.js), after GitHub's
  # scheduled-workflow queue turned out to be unreliable in practice (see
  # /areas/askthegrid-forecast-eval notes -- this is a documented GitHub
  # limitation, not specific to this repo). Keeping workflow_dispatch so the
  # old Python pipeline can still be run manually if ever useful for
  # comparison/debugging -- it's otherwise fully superseded.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest forecasts
        env:
          ASKTHEGRID_API_KEY: ${{ secrets.ASKTHEGRID_API_KEY }}
        run: python orchestrator.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data dashboard/data
          git diff --cached --quiet || git commit -m "Update forecasts $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      # If deploying to Cloudflare Pages via Git integration, this step isn't
      # needed -- Pages will redeploy automatically on the push above. If you
      # hit the same Cron Trigger / KV binding reversion issue noted on the
      # ESR Utilization Worker, deploy with wrangler directly instead:
      #
      # - name: Deploy via wrangler
      #   run: npx wrangler pages deploy dashboard --project-name=atg-forecast-dashboard
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}